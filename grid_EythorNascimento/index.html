<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Produto - Grid</title>
  <link rel="stylesheet" href="style.css">
 
</head>
<body>
  <div class="card">
    <img src="img/robot.png" alt="Robô">
    <div class="card-content">
      <h2>Perceptron</h2>
      <div class="price">R$ 5999</div>
      <p>
        O Perceptron é o melhor robô doméstico já criado e disponível no mercado.
        Capaz de realizar as mais diversas tarefas, ele é o item que faltava para
        facilitar sua vida e tornar o ambiente mais seguro e agradável.
      </p>
      <a href="#" class="btn">Comprar</a>
    </div>
  </div>
</body>
</html>
